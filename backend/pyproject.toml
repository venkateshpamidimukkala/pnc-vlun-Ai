[project]
name = "pnc-vuln-ai-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "psycopg[binary]==3.3.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
