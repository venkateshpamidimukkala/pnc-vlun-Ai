name: pnc-vuln-ai-ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall backend/app
      - run: pytest backend/tests
      - run: pip install ruff && ruff check backend/app
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package.json}
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: '.', severity: CRITICAL,HIGH,ignore-unfixed: true}
